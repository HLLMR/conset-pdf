[package]
name = "classify-pdf"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "classify-pdf"
path = "classify_pdf.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
pdfium-render = { version = "0.8", features = ["image"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
