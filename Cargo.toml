[workspace]
members = [
    "crates/engine",
    "crates/ir",
    "crates/audit",
    "crates/pdf-extraction",
    "crates/contracts",
    "crates/workflows",
    "crates/standards-data",
    "apps/backend-cli",
    "apps/desktop-gui",
    "tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["HLLMR LLC"]

[workspace.lints.clippy]
# Enable pedantic warnings
pedantic = { level = "warn", priority = -1 }
# Allow certain pedantic lints that conflict with our architecture
module_name_repetitions = "allow"

[workspace.dependencies]
# Common dependencies (versions defined once)
anyhow = "1.0"
lopdf = "0.40.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tempfile = "3"

# Workspace crates
conset-pdf-ir = { path = "crates/ir" }
conset-pdf-audit = { path = "crates/audit" }
conset-pdf-extraction = { path = "crates/pdf-extraction" }
conset-pdf-contracts = { path = "crates/contracts" }
conset-pdf-workflows = { path = "crates/workflows" }
conset-pdf-engine = { path = "crates/engine" }