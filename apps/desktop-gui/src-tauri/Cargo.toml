[package]
name = "conset-pdf-desktop-gui-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["HLLMR LLC"]
publish = false

[lints]
workspace = true

[lib]
name = "conset_pdf_desktop_gui_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 core + plugins
tauri = { version = "2", features = ["test"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Workspace contracts (IPC boundary — no engine import)
conset-pdf-contracts = { path = "../../../crates/contracts", features = ["specta"] }
conset-pdf-ir = { path = "../../../crates/ir", features = ["specta"] }
specta = "=2.0.0-rc.22"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta-typescript = "=0.0.9"
